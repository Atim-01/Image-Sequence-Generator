<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero Sequence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
      data-fonts
    />
    <link rel="stylesheet" href="./css/hero.css" />
  </head>
  <body>
    <div id="loader" class="loader" aria-live="polite">
      <p class="loader__label">Loading sequence</p>
      <div class="loader__track">
        <div class="loader__bar" data-loader-bar></div>
      </div>
      <p class="loader__pct" data-loader-pct>0%</p>
    </div>

    <section id="hero" class="hero">
      <canvas id="hero-canvas" class="hero__canvas"></canvas>
      <div class="hero__copy">
        <h1 class="hero__line" data-caption="a">Experience the Extraordinary.</h1>
        <h1 class="hero__line" data-caption="b">Designed to inspire your everyday.</h1>
      </div>
      <p class="hero__hint">Scroll</p>
    </section>

    <section class="after" id="after">
      <p>The sequence lives in the scroll. What comes next is yours.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
