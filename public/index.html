<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Site Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/studio.css" />
  </head>
  <body>
    <div class="studio" id="studio">
      <aside class="panel" id="panel">
        <div class="panel__toolbar">
          <button
            type="button"
            class="icon-btn"
            id="collapse-sidebar"
            aria-controls="panel"
            aria-expanded="true"
            title="Collapse sidebar"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M10.5 3.5 6 8l4.5 4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Collapse sidebar</span>
          </button>
        </div>
        <header class="brand">
          <p class="brand__kicker">Scroll site</p>
          <h1>Turn frames into a scroll-triggered page.</h1>
          <p class="brand__lede">
            Export stills with any free converter (or this project’s CLI), drop
            them here, then download a clean site.
          </p>
        </header>

        <form class="panel__form" id="studio-form">
          <section class="block">
            <div
              class="drop"
              id="drop"
              tabindex="0"
              role="button"
              aria-label="Drop a folder or zip of frames"
            >
              <input
                id="file-input"
                class="sr-only"
                type="file"
                accept=".zip,image/webp,image/jpeg,image/png,.webp,.jpg,.jpeg,.png"
                multiple
              />
              <input
                id="dir-input"
                class="sr-only"
                type="file"
                webkitdirectory
                directory
                multiple
              />
              <p class="drop__title">Drop a folder or zip</p>
              <p class="drop__hint">Numbered frames · WebP, JPG, or PNG</p>
              <div class="drop__actions">
                <button type="button" class="btn btn--ghost" data-pick-files>
                  Choose files
                </button>
                <button type="button" class="btn btn--ghost" data-pick-folder>
                  Choose folder
                </button>
              </div>
              <button type="button" class="text-btn" data-sample>
                Or try sample frames
              </button>
            </div>
            <p class="status" id="status" aria-live="polite"></p>
            <div class="progress is-hidden" id="progress" aria-hidden="true">
              <div class="progress__track">
                <div class="progress__bar" id="progress-bar"></div>
              </div>
              <p class="progress__label" id="progress-label">Preparing…</p>
            </div>
          </section>

          <section class="block">
            <label class="field">
              <span>Line one</span>
              <input
                id="caption-a"
                type="text"
                maxlength="80"
                placeholder="e.g., Experience the Extraordinary."
              />
            </label>
            <label class="field">
              <span>Line two</span>
              <input
                id="caption-b"
                type="text"
                maxlength="80"
                placeholder="e.g., Designed to inspire your everyday."
              />
            </label>
            <label class="field">
              <span>Closing line</span>
              <input
                id="caption-after"
                type="text"
                maxlength="100"
                placeholder="e.g., The sequence lives in the scroll. What comes next is yours."
              />
            </label>
            <label class="field">
              <span>Font</span>
              <select id="font"></select>
            </label>
            <fieldset class="theme">
              <legend>Background</legend>
              <label>
                <input type="radio" name="theme" value="dark" checked />
                Dark
              </label>
              <label>
                <input type="radio" name="theme" value="light" />
                Light
              </label>
            </fieldset>
          </section>

          <button type="button" class="btn btn--gold" id="download" disabled>
            Download site
          </button>
        </form>
      </aside>

      <button type="button" class="rail rail--west" id="expand-sidebar">
        Show sidebar
      </button>

      <section class="stage" id="stage">
        <div class="stage__toolbar">
          <button
            type="button"
            class="icon-btn"
            id="collapse-preview"
            aria-controls="stage"
            aria-expanded="true"
            title="Collapse preview"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M5.5 3.5 10 8 5.5 12.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Collapse</span>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="expand-preview"
            title="Expand preview"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M3 9.5V13h3.5M13 6.5V3H9.5M3 13l4-4M13 3 9 7"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Expand</span>
          </button>
        </div>
        <div class="stage__empty" id="empty">
          <p>Your scroll site will preview here.</p>
        </div>
        <iframe
          id="preview"
          class="stage__frame is-hidden"
          title="Scroll site preview"
        ></iframe>
      </section>

      <button type="button" class="rail rail--east" id="expand-preview-rail">
        Show preview
      </button>
    </div>
    <script type="module" src="./js/studio.js"></script>
  </body>
</html>
